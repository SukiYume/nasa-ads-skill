<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="检索个人天文文献库，阅读文章总结与科学发现，按主题和写作用途筛选并导出引用。">
  <link rel="icon" href="data:,">
  <title>NASA ADS · 个人文献库</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#workspace">跳到文献列表</a>
  <header class="topbar">
    <button id="navigation-toggle" class="icon-button mobile-nav" aria-label="展开文献导航" aria-expanded="false">☰</button>
    <a class="brand" href="/">NASA ADS <span>文献库</span></a>
    <button id="library-info" class="library-source"><span class="status-dot"></span><span id="library-label">本地文献库</span><span class="source-arrow">⌄</span></button>
  </header>
  <button id="nav-backdrop" class="nav-backdrop" aria-label="收起文献导航" hidden></button>
  <div class="layout">
    <aside id="navigation" class="sidebar" aria-label="文献导航">
      <div class="library-overview"><p class="eyebrow">MY LIBRARY</p><h1>我的文献</h1><p id="stats" class="muted" aria-live="polite">正在读取…</p></div>
      <button id="all" class="nav-button active"><span>全部文献</span><span id="all-count" class="nav-count"></span></button>
      <button id="uncategorized" class="nav-button"><span>待分类</span><span id="uncategorized-count" class="nav-count">0</span></button>
      <div class="section-heading"><h2>主题目录</h2><button id="collapse-tree" class="text-button" aria-label="收起全部主题目录">收起</button></div>
      <nav id="collections" aria-label="主题目录"></nav>
      <div class="section-heading"><h2>写作用途</h2><span class="muted">可与主题组合</span></div>
      <div id="roles" class="role-list"></div>
      <p class="sidebar-note">一篇文献，可连接多个研究问题。</p>
    </aside>
    <main id="workspace" class="workspace" tabindex="-1">
      <div class="workspace-header">
        <div class="list-heading"><div><p id="breadcrumb" class="eyebrow">文献总览</p><h2 id="view-title">全部文献</h2></div><button id="refresh" class="subtle" title="重新读取当前文献库">刷新</button></div>
        <p id="collection-summary" class="collection-summary" hidden></p>
        <form id="search-form" role="search" novalidate>
          <label for="query" class="sr-only">搜索文献</label>
          <div class="searchbox"><span aria-hidden="true" class="search-symbol">⌕</span><input id="query" type="search" placeholder="标题、方法、对象或研究结论" autocomplete="off" maxlength="1000"><button type="submit">搜索</button></div>
          <div class="filters">
            <label>范围 <select id="scope"><option value="all">全部内容</option><option value="metadata">题录与摘要</option><option value="summary">阅读总结</option><option value="fulltext">已存全文</option></select></label>
            <label>阅读 <select id="status"><option value="">全部层级</option><option value="full">完整阅读</option><option value="visual">视觉阅读</option><option value="abstract">摘要记录</option><option value="metadata">题录记录</option><option value="targeted">局部阅读</option></select></label>
            <label>排序 <select id="sort"><option value="year-desc">发表年 ↓</option><option value="year-asc">发表年 ↑</option><option value="recent">最近入库</option><option value="title">标题 A–Z</option><option value="relevance">检索相关性</option></select></label>
            <details class="year-filter"><summary>年份</summary><div class="year-inputs"><label>起始年<input id="year-from" type="number" min="1" max="9999" placeholder="不限" aria-describedby="year-feedback"></label><span aria-hidden="true">—</span><label>截止年<input id="year-to" type="number" min="1" max="9999" placeholder="不限" aria-describedby="year-feedback"></label><div class="year-actions"><button id="apply-years" type="button">应用年份</button><button id="clear-years" type="button" class="text-button">清空年份</button></div><p id="year-feedback" class="year-feedback" role="status">调整范围后，点击应用年份。</p></div></details>
          </div>
        </form>
        <div id="active-filters" class="active-filters" aria-label="当前筛选"></div>
        <div class="list-tools"><label class="page-selection"><input id="select-page" type="checkbox" aria-label="选择本页全部文献"><span id="result-count" aria-live="polite"></span></label><div class="export-tools"><button id="clear-selection" class="text-button" hidden>清空选择</button><button id="export" class="text-button" disabled>导出所选</button><button id="export-view" class="text-button">导出当前结果</button></div></div>
      </div>
      <p id="list-feedback" class="feedback" role="status" hidden></p>
      <div id="papers" class="papers" aria-live="polite"></div>
      <div class="pagination"><button id="previous" class="subtle">← 上一页</button><span id="page-label"></span><button id="next" class="subtle">下一页 →</button></div>
    </main>
    <aside id="reader" class="reader" aria-label="文献详情" tabindex="-1"><div class="reader-empty"><span class="reader-mark" aria-hidden="true">Aa</span><p class="eyebrow">阅读与引用</p><h2>选择文献，开始阅读</h2><p>选择一篇文献，阅读总结与科学发现，<br>查看完整版本，获取引用。</p><span class="keyboard-hint">按 / 搜索文献</span></div></aside>
  </div>
  <dialog id="library-dialog"><div class="dialog-heading"><h2>当前文献库</h2><button id="close-library-dialog" class="icon-button" aria-label="关闭文献库信息">×</button></div><p id="library-details"></p><p class="muted">页面直接读取这个目录。通过 skill 新增或整理文献后，点击刷新即可查看。</p></dialog>
  <div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
